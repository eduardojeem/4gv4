<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #ffffff;
        color: #0f172a;
      }
      main { max-width: 26rem; text-align: center; }
      .icon {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        background: rgba(15, 23, 42, 0.06);
        font-size: 1.75rem;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.25rem; font-weight: 700; }
      p { margin: 0 0 1.5rem; font-size: 0.9rem; line-height: 1.6; color: #475569; }
      button {
        font: inherit;
        font-weight: 600;
        font-size: 0.875rem;
        padding: 0.625rem 1.25rem;
        border-radius: 0.75rem;
        border: 1px solid rgba(15, 23, 42, 0.15);
        background: #0f172a;
        color: #ffffff;
        cursor: pointer;
      }
      button:hover { opacity: 0.9; }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1120; color: #e2e8f0; }
        p { color: #94a3b8; }
        .icon { background: rgba(226, 232, 240, 0.08); }
        button { background: #e2e8f0; color: #0b1120; border-color: rgba(226, 232, 240, 0.2); }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">📡</div>
      <h1>Sin conexión</h1>
      <p>
        No pudimos conectarnos. Revisá tu conexión a internet y volvé a intentar.
        Los datos de ventas, stock y saldos siempre se piden en vivo, así que no
        mostramos información guardada que pueda estar desactualizada.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
